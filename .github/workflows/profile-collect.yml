# Trigger-refresh v4 — Fix: operator CRD field, load intensity (40k series), timing
name: Profile Collect
# Spins up Prometheus in kind, drives a REAL load mix DURING the pprof
# capture window, captures a 60s CPU pprof, validates it with pgoctl
# (including package-share coverage gates for the bench hot paths), and
# uploads as a workflow artifact. Run manually (workflow_dispatch) to
# produce testdata/prometheus_cpu.pprof.
#
# Load mix (all backgrounded, all overlapping the full capture window):
#   - hack/loadgen: continuous remote-write of high-cardinality, churning
#     series -> hammers head append + WAL (tsdb hot paths).
#   - hey query_range loops: rate/count aggregations over those series ->
#     chunk iteration, postings (label matchers), promql eval.
#
# Coverage gate: validate requires combined flat CPU share of the tsdb
# family >= 5% and promql >= 1.5% (--min-package-share). A capture that
# doesn't cover the bench routes fails loudly and leaves no artifact.
#
# v4 fixes on top of v3:
#   1. Helm flag: prometheus.prometheusSpec.enableRemoteWriteReceiver=true
#      (operator CRD field; server.extraArgs is silently ignored)
#   2. Pod-args diagnostic: kubectl get pods -o jsonpath (exec -l is invalid)
#   3. Endpoint check: POST + treat 405 as error + exit 1 on failure
#   4. Load intensity: 40k series / batch 2k / churn 0.2 / 120s window
#      hey: c50 for query_range, c20 for instant
#   5. Timing fix: Collect CPU profile runs DURING load (not after wait);
#      head_samples delta (BEFORE/AFTER) proves remote-write ingestion
#
# NOTE: workflow_dispatch only fires from the DEFAULT branch, so this
# workflow goes live for dispatch only after it is merged to main.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      duration:
        description: 'Profile duration in seconds (load overlaps capture)'
        required: false
        default: '60'

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: pgoctl-dev

      - name: Install Helm
        uses: azure/setup-helm@v4

      # v4 fix 1: prometheus.prometheusSpec.enableRemoteWriteReceiver=true is the
      # operator CRD field that wires up --web.enable-remote-write-receiver on the
      # Prometheus binary. server.extraArgs has no template in kube-prometheus-stack
      # and is silently ignored.
      - name: Deploy Prometheus (pprof on by default)
        run: |
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo update
          kubectl create namespace monitoring
          helm upgrade --install prometheus \
            prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --set grafana.enabled=false \
            --set alertmanager.enabled=false \
            --set 'prometheus.prometheusSpec.enableRemoteWriteReceiver=true' \
            --wait --timeout 5m

      # v4 fix 2: kubectl exec -l is invalid. Use kubectl get pods -o jsonpath
      # to dump actual pod CLI args for flag-level verification.
      - name: Verify remote-write flag reached the pod
        run: |
          echo "::group::Helm rendered values (remote-write relevant)"
          helm get values prometheus -n monitoring | grep -A 5 -i "remote" || echo "no remote-write values found"
          echo "::endgroup::"
          echo "::group::Pod args (look for web.enable-remote-write-receiver)"
          kubectl get pods -n monitoring -l app.kubernetes.io/name=prometheus \
            -o jsonpath='{.items[0].spec.containers[0].args}' | python3 -m json.tool || true
          echo "::endgroup::"

      # Real readiness gate before port-forward: `helm --wait` only proves
      # the deployment was Ready at install time, not that the prometheus
      # container is still serving when we connect.
      - name: Wait for Prometheus pod Ready
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod \
            -n monitoring \
            -l app.kubernetes.io/name=prometheus \
            --timeout=300s

      - name: Dump diagnostics (only if readiness wait failed)
        if: failure()
        run: |
          echo "::group::All monitoring pods"
          kubectl get pods -n monitoring -o wide || true
          echo "::endgroup::"
          echo "::group::Prometheus pod describe"
          kubectl describe pod -n monitoring \
            -l app.kubernetes.io/name=prometheus || true
          echo "::endgroup::"
          echo "::group::Prometheus pod logs"
          kubectl logs -n monitoring \
            -l app.kubernetes.io/name=prometheus --tail=200 || true
          echo "::endgroup::"

      - name: Port-forward Prometheus
        run: |
          kubectl port-forward -n monitoring \
            svc/prometheus-kube-prometheus-prometheus 9090:9090 &
          # wait for port-forward to be ready (retry transient conn refused)
          timeout 60 bash -c \
            'until curl -sf --retry 5 --retry-connrefused http://localhost:9090/-/ready; do sleep 2; done'

      # v4 fix 3: send POST (GET always returns 405 regardless of receiver state),
      # treat 404+405 as hard errors and exit 1 so a dead receiver gates the run
      # instead of silently passing.
      - name: Verify remote-write endpoint
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H 'Content-Type: application/x-protobuf' --data-binary '' http://localhost:9090/api/v1/write)
          echo "Remote-write endpoint HTTP status: $HTTP_CODE (expect 400 or 204, NOT 404/405/503)"
          BODY=$(curl -s -X POST -H 'Content-Type: application/x-protobuf' --data-binary '' http://localhost:9090/api/v1/write)
          echo "Response body: $BODY"
          if [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "405" ] || [ "$HTTP_CODE" = "503" ]; then
            echo "::error::Remote-write endpoint NOT available ($HTTP_CODE) — receiver is OFF, loadgen data will be silently dropped"
            exit 1
          fi

      # v4 fix 4+5: load intensity + timing.
      #
      # Intensity: 40k series / batch 2k / churn 0.2 / 120s. hey c50 (query_range),
      # c20 (instant). Previous 4k/75s was consumed in seconds; 40k/120s saturates
      # tsdb head appends and WAL during the full capture window.
      #
      # Timing: SAMPLES_BEFORE captured here and saved to GITHUB_ENV. Loadgen starts
      # immediately. After 30s warmup, hey launches with a query window anchored to
      # actual write data. The CPU profile capture (next step) runs during the
      # remaining ~90s of active load. Check loadgen (after profile) calls wait and
      # computes SAMPLES_AFTER delta to prove ingestion happened.
      - name: Drive load during capture (remote-write + queries)
        run: |
          go install github.com/rakyll/hey@latest
          go build -o /tmp/loadgen ./hack/loadgen
          go build -o /tmp/baseline ./cmd/baseline

          # Capture baseline sample count before any writes land
          SAMPLES_BEFORE=$(curl -s http://localhost:9090/metrics \
            | grep 'prometheus_tsdb_head_samples_appended_total' \
            | grep 'type="float"' \
            | awk '{print $2}')
          echo "Head samples before load: ${SAMPLES_BEFORE:-0}"
          echo "SAMPLES_BEFORE=${SAMPLES_BEFORE:-0}" >> "$GITHUB_ENV"

          # Start loadgen: 120s / 40k series / batch 2k / 20% churn
          nohup /tmp/loadgen \
            --url http://localhost:9090/api/v1/write \
            --duration 120 \
            --series 40000 \
            --batch 2000 \
            --churn 0.2 \
            > /tmp/loadgen.log 2>&1 &
          echo "loadgen started in background (pid $!)"

          # 30s warmup: let Prometheus ingest real data before hey queries start
          echo "Waiting 30s for data to accumulate..."
          sleep 30

          # Query window anchored to loadgen start (30s ago) through end of load
          START=$(date -d '30 seconds ago' +%s)
          END=$(date -d '90 seconds' +%s)

          nohup hey -z 90s -c 50 \
            "http://localhost:9090/api/v1/query_range?query=sum%28rate%28loadgen_metric_a%5B1m%5D%29%29%20by%20%28job%29&start=${START}&end=${END}&step=15s" \
            > /tmp/hey-qr1.log 2>&1 &
          echo "hey query_range (rate by job) started (pid $!)"
          nohup hey -z 90s -c 50 \
            "http://localhost:9090/api/v1/query_range?query=count%28loadgen_metric_a%29&start=${START}&end=${END}&step=15s" \
            > /tmp/hey-qr2.log 2>&1 &
          echo "hey query_range (count) started (pid $!)"
          nohup hey -z 90s -c 20 \
            'http://localhost:9090/api/v1/query?query=up' \
            > /tmp/hey-q.log 2>&1 &
          echo "hey instant started (pid $!)"

      # v4: profile capture runs during active load window (not after wait).
      # Pre-built /tmp/baseline starts immediately without compilation delay (v3 fix).
      - name: Collect CPU profile (retry once)
        run: |
          DUR=${{ github.event.inputs.duration || 60 }}
          mkdir -p testdata
          for attempt in 1 2; do
            echo "--- capture attempt $attempt (${DUR}s) ---"
            if /tmp/baseline \
              --url http://localhost:9090/debug/pprof/profile \
              --seconds "$DUR" \
              --min-samples 1000 \
              --out testdata/prometheus_cpu.pprof; then
              echo "capture OK on attempt $attempt"
              break
            fi
            echo "capture failed on attempt $attempt"
            if [ "$attempt" -eq 2 ]; then
              echo "::error::CPU profile capture failed after 2 attempts"
              exit 1
            fi
            echo "waiting 15s before retry..."
            sleep 15
          done

      # After profile: wait for load to complete, then check ingestion proof.
      # SAMPLES_BEFORE was saved to GITHUB_ENV in "Drive load" step.
      - name: Check loadgen and query results
        run: |
          echo "::group::Loadgen exit code + last 20 lines of log"
          wait || true
          echo "loadgen exit code: $?"
          tail -20 /tmp/loadgen.log || echo "no loadgen log"
          echo "::endgroup::"
          echo "::group::Hey query response summary (first 30 lines each)"
          for f in /tmp/hey-qr1.log /tmp/hey-qr2.log /tmp/hey-q.log; do
            echo "--- $f ---"
            if [ -f "$f" ]; then
              head -30 "$f"
            fi
          done
          echo "::endgroup::"
          echo "::group::Head samples delta (remote-write ingestion proof)"
          SAMPLES_AFTER=$(curl -s http://localhost:9090/metrics \
            | grep 'prometheus_tsdb_head_samples_appended_total' \
            | grep 'type="float"' \
            | awk '{print $2}')
          echo "Before load: ${SAMPLES_BEFORE:-0}"
          echo "After load:  ${SAMPLES_AFTER:-0}"
          DELTA=$(python3 -c "print(int(float('${SAMPLES_AFTER:-0}') - float('${SAMPLES_BEFORE:-0}')))" 2>/dev/null || echo "unknown")
          echo "Delta (samples written during load): ${DELTA}"
          echo "::endgroup::"
          echo "::group::Prometheus active series count"
          curl -s http://localhost:9090/api/v1/query?query=count%28up%29 | python3 -m json.tool 2>/dev/null || echo "query failed"
          echo "::endgroup::"
          echo "::group::Prometheus scrape targets summary"
          curl -s http://localhost:9090/api/v1/targets | python3 -c 'import json,sys;d=json.load(sys.stdin);t=d.get("data",{}).get("activeTargets",[]);p=d.get("data",{}).get("scrapePools",[]);print("Targets: %d, Scrape pools: %d" % (len(t),len(p)))' 2>/dev/null || echo "targets query failed"
          echo "::endgroup::"

      - name: Stop load
        run: |
          pkill -f '/tmp/loadgen' || true
          pkill -f 'hey -z' || true
          wait || true

      - name: Report sample count
        run: |
          SAMPLES=$(go run ./cmd/pgoctl validate \
            --min-samples 1000 \
            --min-package-share github.com/prometheus/prometheus/tsdb:5.0 \
            --json testdata/prometheus_cpu.pprof \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['samples'])" 2>/dev/null || echo 0)
          echo "captured profile samples: ${SAMPLES}"

      # DIAGNOSTIC 4: Detailed coverage breakdown for debugging 0% coverage.
      - name: Show full coverage report
        run: |
          echo "::group::Full pgoctl validate output (no --json for readable breakdown)"
          go run ./cmd/pgoctl validate testdata/prometheus_cpu.pprof || true
          echo "::endgroup::"

      - name: Validate profile with pgoctl
        run: |
          go run ./cmd/pgoctl validate \
            --min-samples 1000 \
            --min-score 0.3 \
            --min-package-share github.com/prometheus/prometheus/tsdb:5.0 \
            --min-package-share github.com/prometheus/prometheus/promql:1.5 \
            --json \
            testdata/prometheus_cpu.pprof

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prometheus-pprof-${{ github.run_id }}
          path: testdata/prometheus_cpu.pprof
          retention-days: 30

      - name: Summary
        run: |
          SIZE=$(wc -c < testdata/prometheus_cpu.pprof)
          echo "## Profile Collect
          - Profile: \`testdata/prometheus_cpu.pprof\`
          - Size: ${SIZE} bytes
          - Duration: ${{ github.event.inputs.duration || 60 }}s

          Download artifact **prometheus-pprof-${{ github.run_id }}** and commit to \`testdata/\` to enable pgo-bench." \
          >> $GITHUB_STEP_SUMMARY
