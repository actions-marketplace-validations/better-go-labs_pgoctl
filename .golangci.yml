version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - misspell
    - revive
    - gosec
    - unconvert
    - bodyclose
  exclusions:
    rules:
      # CLI tools intentionally accept user-supplied file paths; G304 is expected behaviour
      - linters: [gosec]
        text: "G304:"

formatters:
  enable:
    - gofmt
    - goimports
